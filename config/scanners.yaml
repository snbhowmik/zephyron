# T-006. Every scanner pinned by digest (SECURITY.md §3 — "digests, not
# tags; a tag is a mutable pointer to code we will execute with a
# filesystem mounted"). `make scanners-pull` reads this file.
#
# Digests below were verified live against each registry's anonymous OCI
# API on 2026-09-18 (not carried forward from documentation or memory).
# Re-verify before relying on this file after that date — a digest is
# exact for the moment it was pulled, not forever.

# --- Upstream-published container images, pulled and pinned as-is ---
container_images:
  source_scan.cdxgen:
    image: ghcr.io/cdxgen/cdxgen
    digest: sha256:1d4418545662790662567f96af62bf0f8a444eb552bf2c4cb7b35eb0a7d6234e
    verified_tag: latest
    licence: Apache-2.0
    verified_on: 2026-09-18

  sbom.syft:
    image: ghcr.io/anchore/syft
    digest: sha256:500e2d872ac019436926e8322b4fc1f39441d94d21f6f4046c6ff29b30e8cb02
    verified_tag: latest
    licence: Apache-2.0
    verified_on: 2026-09-18

  container.theia:
    image: ghcr.io/cbomkit/cbomkit-theia
    digest: sha256:46a72eadc9849b919fc4c72e1c851f9783e03c35db8fad49ba99341ac97f8dea
    verified_tag: latest
    licence: Apache-2.0
    verified_on: 2026-09-18
    note: >
      Also invoked agent-side via its `dir` command for tls.store
      (ARCH.md §2.2, §3a) — same image, same digest, different invocation.

# --- QAVACH-built wrapper images: no suitable upstream image exists, so we
# build and pin our own. Not yet built — each references the task that
# builds it. Do NOT invent a digest for these; leave them unset until the
# task lands, per the "honest stub" rule (NOTE.md §4.4). ---
qavach_built_images:
  source_scan.opengrep:
    upstream: opengrep/opengrep
    upstream_licence: LGPL-2.1
    release: v1.30.0
    release_asset: opengrep_manylinux_x86
    release_asset_sha256: 35779bdd72e92129c8df2a77f0c55e8c08356801ea92591ef32108d6b28d564c
    dockerfile: docker/opengrep/Dockerfile
    rules: config/opengrep-rules/crypto.yaml
    build_command: make build-images
    reason: >
      No official container image published (no Dockerfile, no image
      publish workflow, verified against the live repo 2026-09-18).
      Separate-process-only per NFR-10 - never linked or vendored. The
      release binary is checksum-verified at build time; its engine is
      pre-extracted into the image because the sandbox's noexec tmpfs
      forbids the first-run unpack. The rule pack is baked in, so the image
      ID pins engine and rules together.
    built_by: T-037
    verified_on: 2026-09-19
    digest: null

  source_scan.cbomkit:
    upstream: cbomkit/cbomkit-lib
    upstream_licence: Apache-2.0
    plugin: cbomkit/sonar-cryptography (Apache-2.0), tag 1.7.0
    dockerfile: docker/cbomkit-lib/Dockerfile
    build_command: make build-images
    reason: >
      cbomkit-lib is a library with no main, and its dependency
      com.ibm:sonar-cryptography-plugin is published only to GitHub
      Packages (PAT required even to read; not on Maven Central — checked).
      Both are Apache-2.0, so QAVACH builds the plugin from its pinned
      release tag inside the image build: no credential at build or scan
      time. Inputs pinned by full commit SHA + base-image digest.
    built_by: T-038
    verified_on: 2026-09-19
    # A registry digest is assigned only when the image is published. Until
    # then a locally built image is pinned by its content-addressed ID
    # (`make build-images` prints it) — never by a tag.
    digest: null

  ad.adcs:
    upstream: ly4k/Certipy
    upstream_licence: MIT
    dockerfile: docker/certipy/Dockerfile
    build_command: make build-images
    pinned_commit: 3ae34426c58d266a1979ff9607514c3d7fe1aa21
    reason: >
      Certipy is normally pip-installed. The one community image
      (secure-77/Certipy-Docker) is unlicensed and stale (last push
      2024-03-28) — do not depend on it. Built from the exact upstream
      commit whose `find` JSON schema the parser was written against; PyPI's
      5.1.0 predates it. Verified 2026-09-19: the image runs sandboxed and
      the stdin-password path works. NOT verified against a real domain.
    built_by: T-045
    digest: null

# --- Agent-side release artefacts (ARCH.md §3a): not containers at all —
# the agent has no Docker/Podman available on the target host. Pinned by
# release version + published checksum instead of a digest. ---
agent_artifacts:
  tls.store.certfinder:
    repo: krisiasty/certfinder
    version: v0.7.0
    licence: Apache-2.0
    linux_amd64_sha256: cb59af8f99efc34efce6fa2f918da54a79a44b8c5cae49f3e2de586ca5614a85
    verified_on: 2026-09-18
    note: >
      22-commit history at time of adoption (NOTE.md §7) — re-check
      maintenance status before pinning a new version.
