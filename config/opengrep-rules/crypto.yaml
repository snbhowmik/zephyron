# T-037 / NOTE.md section 3.3: the breadth tier. Thirty-nine rules - deliberately not
# more. Opengrep matches API *names*; it cannot tell a live call from a test
# fixture or a comment, so findings are PATTERN confidence and the false
# positives are handled by the confidence tier and dispute mechanism, not by
# tuning this file.
#
# Every rule carries `metadata.qavach_*`, which the adapter maps to a claim
# - the adapter never parses rule messages. Fields:
#   qavach_algorithm  CycloneDX registry family name
#   qavach_primitive  optional
#   qavach_parameter  optional (only when the API name fixes it)
# Languages are the ones the AST scanners (cdxgen, cbomkit-lib) miss:
# C/C++, C#, PHP, Ruby, Rust.
rules:
  - id: qavach.c.openssl-md5
    languages: [c, cpp]
    severity: WARNING
    message: MD5 via OpenSSL API
    pattern-either:
      - pattern: EVP_md5()
      - pattern: MD5_Init(...)
      - pattern: MD5(...)
    metadata: {qavach_algorithm: MD5, qavach_primitive: hash}

  - id: qavach.c.openssl-sha1
    languages: [c, cpp]
    severity: WARNING
    message: SHA-1 via OpenSSL API
    pattern-either:
      - pattern: EVP_sha1()
      - pattern: SHA1_Init(...)
      - pattern: SHA1(...)
    metadata: {qavach_algorithm: SHA-1, qavach_primitive: hash}

  - id: qavach.c.openssl-des
    languages: [c, cpp]
    severity: WARNING
    message: DES/3DES via OpenSSL API
    patterns:
      - pattern: $F(...)
      - metavariable-regex: {metavariable: $F, regex: '^EVP_des_(ede3_)?(cbc|ecb|cfb\d*|ofb)$'}
    metadata: {qavach_algorithm: 3DES, qavach_primitive: block-cipher}

  - id: qavach.c.openssl-rc4
    languages: [c, cpp]
    severity: WARNING
    message: RC4 via OpenSSL API
    pattern-either:
      - pattern: EVP_rc4()
      - pattern: RC4_set_key(...)
    metadata: {qavach_algorithm: RC4, qavach_primitive: stream-cipher}

  - id: qavach.c.openssl-aes
    languages: [c, cpp]
    severity: INFO
    message: AES via OpenSSL API
    patterns:
      - pattern: $F(...)
      - metavariable-regex: {metavariable: $F, regex: '^EVP_aes_(128|192|256)_\w+$'}
    metadata: {qavach_algorithm: AES, qavach_primitive: block-cipher}

  - id: qavach.c.openssl-rsa
    languages: [c, cpp]
    severity: INFO
    message: RSA via OpenSSL API
    pattern-either:
      - pattern: RSA_generate_key_ex(...)
      - pattern: RSA_new()
    metadata: {qavach_algorithm: RSA}

  - id: qavach.csharp.md5
    languages: [csharp]
    severity: WARNING
    message: MD5 via System.Security.Cryptography
    pattern: MD5.Create()
    metadata: {qavach_algorithm: MD5, qavach_primitive: hash}

  - id: qavach.csharp.sha1
    languages: [csharp]
    severity: WARNING
    message: SHA-1 via System.Security.Cryptography
    pattern: SHA1.Create()
    metadata: {qavach_algorithm: SHA-1, qavach_primitive: hash}

  - id: qavach.csharp.rsa
    languages: [csharp]
    severity: INFO
    message: RSA via System.Security.Cryptography
    pattern-either:
      - pattern: new RSACryptoServiceProvider(...)
      - pattern: RSA.Create(...)
    metadata: {qavach_algorithm: RSA}

  - id: qavach.csharp.aes
    languages: [csharp]
    severity: INFO
    message: Symmetric cipher via System.Security.Cryptography
    pattern-either:
      - pattern: Aes.Create()
      - pattern: new AesManaged()
    metadata: {qavach_algorithm: AES, qavach_primitive: block-cipher}

  - id: qavach.php.md5
    languages: [php]
    severity: WARNING
    message: md5() call
    pattern: md5(...)
    metadata: {qavach_algorithm: MD5, qavach_primitive: hash}

  - id: qavach.php.sha1
    languages: [php]
    severity: WARNING
    message: sha1() call
    pattern: sha1(...)
    metadata: {qavach_algorithm: SHA-1, qavach_primitive: hash}

  - id: qavach.ruby.openssl-aes
    languages: [ruby]
    severity: INFO
    message: AES via OpenSSL::Cipher
    patterns:
      - pattern: OpenSSL::Cipher.new($C)
      - metavariable-regex: {metavariable: $C, regex: '(?i).*aes'}
    metadata: {qavach_algorithm: AES, qavach_primitive: block-cipher}

  - id: qavach.rust.rsa
    languages: [rust]
    severity: INFO
    message: RSA via the rsa crate
    pattern-either:
      - pattern: RsaPrivateKey::new(...)
      - pattern: rsa::RsaPrivateKey::new(...)
    metadata: {qavach_algorithm: RSA}

  # --- Java-family algorithm *string literals* (found by scanning a real repository:
  # jasypt defines "PBEWithMD5AndDES" as a constant and passes it through configuration,
  # so neither AST scanner sees a literal Cipher.getInstance call). The claim's name is
  # the literal itself, taken from the matched snippet via `qavach_name_regex`; the JCA
  # grammar (normalize/jca.py) then splits a compound name into its algorithms. Still the
  # low-confidence breadth tier: a literal in a comment or a test is a false positive
  # that the confidence tier and dispute mechanism absorb.
  - id: qavach.jvm.jca-compound-name-literal
    languages: [java, kotlin, scala]
    severity: INFO
    message: JCA compound algorithm name as a string literal
    pattern-regex: '"(?:PBEWith[A-Za-z0-9_]+And[A-Za-z0-9_]+|PBKDF2With[A-Za-z0-9_]+|[A-Za-z0-9]+with(?:RSA|DSA|ECDSA)[A-Za-z0-9]*|Hmac(?:MD5|SHA)[A-Za-z0-9/-]*|(?:AES|AES_\d+|DES|DESede|RSA|Blowfish|RC2|RC4)/[A-Z0-9]+/[A-Za-z0-9-]+)"'
    metadata:
      qavach_name_regex: '"((?:PBEWith[A-Za-z0-9_]+And[A-Za-z0-9_]+|PBKDF2With[A-Za-z0-9_]+|[A-Za-z0-9]+with(?:RSA|DSA|ECDSA)[A-Za-z0-9]*|Hmac(?:MD5|SHA)[A-Za-z0-9/-]*|(?:AES|AES_\d+|DES|DESede|RSA|Blowfish|RC2|RC4)/[A-Z0-9]+/[A-Za-z0-9-]+))"'

  - id: qavach.jvm.weak-algorithm-name-literal
    languages: [java, kotlin, scala]
    severity: WARNING
    message: A broken algorithm name (MD2, MD5, SHA-1, DES, DESede, RC2, RC4) as a string literal
    pattern-regex: '"(?:MD2|MD5|SHA-?1|DES|DESede|TripleDES|RC2|RC4|ARCFOUR)"'
    metadata:
      qavach_name_regex: '"(MD2|MD5|SHA-?1|DES|DESede|TripleDES|RC2|RC4|ARCFOUR)"'

  # --- Go standard library (found by scanning kubescape: 23 files use crypto/*, and no
  # scanner covers Go source - cbomkit-lib and cdxgen do not detect it, so all that was
  # reported was dependency-level capability from Syft). Usage patterns, not imports:
  # an unused import is not a use. ---

  - id: qavach.go.md5
    languages: [go]
    severity: WARNING
    message: MD5 via crypto/md5
    pattern-either:
      - pattern: md5.New()
      - pattern: md5.Sum(...)
    metadata: {qavach_algorithm: MD5, qavach_primitive: hash}

  - id: qavach.go.sha1
    languages: [go]
    severity: WARNING
    message: SHA-1 via crypto/sha1
    pattern-either:
      - pattern: sha1.New()
      - pattern: sha1.Sum(...)
    metadata: {qavach_algorithm: SHA-1, qavach_primitive: hash}

  - id: qavach.go.sha256
    languages: [go]
    severity: INFO
    message: SHA-256 via crypto/sha256
    pattern-either:
      - pattern: sha256.New()
      - pattern: sha256.Sum256(...)
    metadata: {qavach_algorithm: SHA-256, qavach_primitive: hash}

  - id: qavach.go.sha512
    languages: [go]
    severity: INFO
    message: SHA-512 via crypto/sha512
    pattern-either:
      - pattern: sha512.New()
      - pattern: sha512.Sum512(...)
    metadata: {qavach_algorithm: SHA-512, qavach_primitive: hash}

  - id: qavach.go.des
    languages: [go]
    severity: WARNING
    message: DES via crypto/des
    pattern-either:
      - pattern: des.NewCipher(...)
    metadata: {qavach_algorithm: DES, qavach_primitive: block-cipher}

  - id: qavach.go.3des
    languages: [go]
    severity: WARNING
    message: 3DES via crypto/des
    pattern-either:
      - pattern: des.NewTripleDESCipher(...)
    metadata: {qavach_algorithm: 3DES, qavach_primitive: block-cipher}

  - id: qavach.go.rc4
    languages: [go]
    severity: WARNING
    message: RC4 via crypto/rc4
    pattern-either:
      - pattern: rc4.NewCipher(...)
    metadata: {qavach_algorithm: RC4, qavach_primitive: stream-cipher}

  - id: qavach.go.aes
    languages: [go]
    severity: INFO
    message: AES via crypto/aes
    pattern-either:
      - pattern: aes.NewCipher(...)
    metadata: {qavach_algorithm: AES, qavach_primitive: block-cipher}

  - id: qavach.go.rsa
    languages: [go]
    severity: INFO
    message: RSA via crypto/rsa
    pattern-either:
      - pattern: rsa.GenerateKey(...)
      - pattern: rsa.EncryptOAEP(...)
      - pattern: rsa.EncryptPKCS1v15(...)
      - pattern: rsa.SignPKCS1v15(...)
      - pattern: rsa.SignPSS(...)
      - pattern: rsa.VerifyPKCS1v15(...)
    metadata: {qavach_algorithm: RSA, qavach_primitive: signature}

  - id: qavach.go.ecdsa
    languages: [go]
    severity: INFO
    message: ECDSA via crypto/ecdsa
    pattern-either:
      - pattern: ecdsa.GenerateKey(...)
      - pattern: ecdsa.Sign(...)
      - pattern: ecdsa.SignASN1(...)
      - pattern: ecdsa.Verify(...)
    metadata: {qavach_algorithm: ECDSA, qavach_primitive: signature}

  - id: qavach.go.ed25519
    languages: [go]
    severity: INFO
    message: Ed25519 via crypto/ed25519
    pattern-either:
      - pattern: ed25519.GenerateKey(...)
      - pattern: ed25519.Sign(...)
      - pattern: ed25519.Verify(...)
    metadata: {qavach_algorithm: EdDSA, qavach_primitive: signature}

  - id: qavach.go.hmac
    languages: [go]
    severity: INFO
    message: HMAC via crypto/hmac
    pattern-either:
      - pattern: hmac.New(...)
    metadata: {qavach_algorithm: HMAC, qavach_primitive: mac}

  # --- Python (cbomkit-lib is the AST engine for Python, but it crashed on erpnext
  # (a converter exception inside the tool), leaving Python with no source-level
  # detection at all; these are the fallback for the same high-value calls). ---

  - id: qavach.py.md5
    languages: [python]
    severity: WARNING
    message: MD5 via hashlib
    pattern-either:
      - pattern: hashlib.md5(...)
    metadata: {qavach_algorithm: MD5, qavach_primitive: hash}

  - id: qavach.py.sha1
    languages: [python]
    severity: WARNING
    message: SHA-1 via hashlib
    pattern-either:
      - pattern: hashlib.sha1(...)
    metadata: {qavach_algorithm: SHA-1, qavach_primitive: hash}

  - id: qavach.py.sha256
    languages: [python]
    severity: INFO
    message: SHA-256 via hashlib
    pattern-either:
      - pattern: hashlib.sha256(...)
    metadata: {qavach_algorithm: SHA-256, qavach_primitive: hash}

  - id: qavach.py.sha512
    languages: [python]
    severity: INFO
    message: SHA-512 via hashlib
    pattern-either:
      - pattern: hashlib.sha512(...)
    metadata: {qavach_algorithm: SHA-512, qavach_primitive: hash}

  - id: qavach.py.blake2
    languages: [python]
    severity: INFO
    message: BLAKE2 via hashlib
    pattern-either:
      - pattern: hashlib.blake2b(...)
      - pattern: hashlib.blake2s(...)
    metadata: {qavach_algorithm: BLAKE2, qavach_primitive: hash}

  - id: qavach.py.hmac
    languages: [python]
    severity: INFO
    message: HMAC via the hmac module
    pattern-either:
      - pattern: hmac.new(...)
    metadata: {qavach_algorithm: HMAC, qavach_primitive: mac}

  - id: qavach.py.pycryptodome-weak
    languages: [python]
    severity: WARNING
    message: DES/RC4/Blowfish via a Crypto.Cipher module
    pattern-either:
      - pattern: DES.new(...)
    metadata: {qavach_algorithm: DES, qavach_primitive: block-cipher}

  - id: qavach.py.pycryptodome-3des
    languages: [python]
    severity: WARNING
    message: 3DES via Crypto.Cipher.DES3
    pattern-either:
      - pattern: DES3.new(...)
    metadata: {qavach_algorithm: 3DES, qavach_primitive: block-cipher}

  - id: qavach.py.pycryptodome-rc4
    languages: [python]
    severity: WARNING
    message: RC4 via Crypto.Cipher.ARC4
    pattern-either:
      - pattern: ARC4.new(...)
    metadata: {qavach_algorithm: RC4, qavach_primitive: stream-cipher}

  - id: qavach.py.pycryptodome-aes
    languages: [python]
    severity: INFO
    message: AES via Crypto.Cipher.AES
    pattern-either:
      - pattern: AES.new(...)
    metadata: {qavach_algorithm: AES, qavach_primitive: block-cipher}

  - id: qavach.py.rsa
    languages: [python]
    severity: INFO
    message: RSA key generation
    pattern-either:
      - pattern: rsa.generate_private_key(...)
      - pattern: RSA.generate(...)
    metadata: {qavach_algorithm: RSA, qavach_primitive: signature}

  - id: qavach.py.ec
    languages: [python]
    severity: INFO
    message: Elliptic-curve key generation
    pattern-either:
      - pattern: ec.generate_private_key(...)
    metadata: {qavach_algorithm: ECDSA, qavach_primitive: signature}
