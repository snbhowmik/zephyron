tls_hybrid_key_share:
  X25519MLKEM768:
    standard: RFC 10024
    source_url: https://www.rfc-editor.org/rfc/rfc10024.txt
    basis: derived
    client_key_share_bytes: 1216
    server_key_share_bytes: 1120
    derivation: "client = X25519 public key (32) + ML-KEM-768 encapsulation key (1184); server = X25519 public key (32) + ML-KEM-768 ciphertext (1088)"
    handshake_extra_bytes_vs_x25519: 2272
    extra_derivation: "(1216 - 32) + (1120 - 32) = 2272 additional bytes across the two key shares versus X25519 alone; record-layer and framing overhead not included"
