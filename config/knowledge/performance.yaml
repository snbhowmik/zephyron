# T-083 / ARCH.md 8.3 / FR-430. Sizes and overheads, each with a source.
#
# RULES: every figure cites a primary source; a figure that is not available
# is `null` and the UI shows "not available" - it is never invented. Timings
# (keygen / sign / verify / encaps / decaps) are ALL `null`: none has been
# measured on a documented platform, and published numbers vary by CPU and
# implementation. A future `bench` command (liboqs / OpenSSL speed) can fill
# them with `measured_on` set.
#
# `basis`:  spec       a size fixed by the standard's parameter table
#           measured   observed by generating real objects with OpenSSL 3.5.8
#                      on 2026-09-20 (`measured_on` names the platform)
#           derived    arithmetic on other rows in this file
# Sizes are in BYTES. The PQC sizes were both read from the standard's tables
# and reproduced by OpenSSL 3.5.8 (`openssl genpkey` / `pkeyutl -encap|-sign`);
# they agree. `sk_bytes` for ML-KEM is the FIPS 203 decapsulation key `dk`.

measured_on: "OpenSSL 3.5.8 (25 Aug 2026), Linux x86_64, 2026-09-20"

