# T-034. purl -> cryptographic capability, for packages/collectors/
# src/qavach_collectors/sbom/crypto_libraries.py (T-033) to attribute
# capability-level RawClaims to a syft-detected dependency.
#
# CAPABILITY, NOT USAGE (TASK.md T-034's own requirement, non-negotiable):
# every `provides` entry says what the library CAN do — the algorithm
# families it implements or exposes an API for — never whether the scanned
# codebase actually calls into that capability, and never a confidence
# score about real-world usage. That distinction is exactly why
# `ConfidenceTier.DEPENDENCY` sits below AST/RUNTIME in ARCH.md §2.2's
# table: "you depend on a library that provides AES" is real evidence, but
# weaker than "this file calls AES directly." Do not add a `used`,
# `confidence`, or `observed` field to an entry — that would smuggle usage
# semantics back in through the schema, defeating the entire point.
#
# `provides` values are algorithm FAMILY names exactly as they appear in
# the vendored CycloneDX 1.7 Cryptography Registry
# (config/knowledge/cdx-crypto-registry/cryptography-defs.json) — e.g.
# "AES", "RSASSA-PKCS1", "ECDSA", "EdDSA", "ECDH", "SHA-2" (not "AES-256"
# or "SHA-256": key size / hash width is a *parameter* of the family, not
# a separate family, and a library capability entry is deliberately
# coarser than that). Every value below was checked live against
# `qavach_core.normalize.resolve_algorithm` (T-012) before being written
# here — none of them resolve to UNKNOWN — see
# tests/collectors/test_crypto_libraries_yaml.py, which re-checks this on
# every test run so a future edit cannot silently introduce a family name
# the resolve layer won't recognise.
#
# This is a **first pass**: TASK.md's own wording is "start with 40
# libraries," not "build the definitive catalogue." Coverage is uneven by
# design — well-known, widely-depended-on libraries with genuinely
# documented capabilities, not an exhaustive survey of every crypto
# package in four ecosystems. Extend it; do not treat an absence here as
# "this library has no crypto capability."

libraries:
  # --- Python (pypi) ---
  - type: pypi
    name: cryptography
    provides:
      [AES, RSASSA-PKCS1, RSASSA-PSS, RSAES-OAEP, ECDSA, EdDSA, ECDH, DSA,
       SHA-2, SHA-3, HMAC, ChaCha20, Poly1305, 3DES, Blowfish, CAMELLIA,
       HKDF, PBKDF2, scrypt]
  - type: pypi
    name: pyjwt
    provides: [HMAC, RSASSA-PKCS1, RSASSA-PSS, ECDSA, EdDSA]
  - type: pypi
    name: pyopenssl
    provides: [AES, RSASSA-PKCS1, ECDSA, DSA, SHA-2, SHA-1]
  - type: pypi
    name: pycryptodome
    provides:
      [AES, DES, 3DES, RC4, RC2, Blowfish, CAST5, CAMELLIA, SM4,
       RSASSA-PKCS1, RSAES-OAEP, ECDSA, EdDSA, DSA, SHA-2, SHA-3, HMAC,
       ChaCha20, Poly1305, Salsa20, PBKDF2, HKDF]
  - type: pypi
    name: pycrypto
    provides: [AES, DES, 3DES, RC4, Blowfish, RSASSA-PKCS1, DSA, SHA-2, HMAC, PBKDF2]
  - type: pypi
    name: bcrypt
    provides: [bcrypt]
  - type: pypi
    name: argon2-cffi
    provides: [Argon2]
  - type: pypi
    name: passlib
    provides: [bcrypt, scrypt, Argon2, PBKDF2, MD5, SHA-2, SHA-1]
  - type: pypi
    name: pynacl
    provides: [EdDSA, ECDH, ChaCha20, Poly1305, Salsa20, HMAC, Argon2, SHA-2]
  - type: pypi
    name: paramiko
    provides: [RSASSA-PKCS1, ECDSA, EdDSA, DSA, AES, 3DES, ChaCha20, HMAC, SHA-2]
  - type: pypi
    name: ecdsa
    provides: [ECDSA]
  - type: pypi
    name: rsa
    provides: [RSASSA-PKCS1, RSAES-PKCS1]
  - type: pypi
    name: python-jose
    provides: [HMAC, RSASSA-PKCS1, RSASSA-PSS, ECDSA, RSAES-OAEP]
  - type: pypi
    name: itsdangerous
    provides: [HMAC, SHA-2]

