[alembic]
script_location = src/qavach_storage/migrations
# The URL comes from QAVACH_DATABASE_URL (see migrations/env.py); never commit one.
sqlalchemy.url =

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
