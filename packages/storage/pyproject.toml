[project]
name = "qavach-storage"
version = "0.1.0"
description = "SQLAlchemy models, repositories and Alembic migrations. See ARCH.md §11."
requires-python = ">=3.12"
dependencies = [
    "qavach-core",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
]

[tool.uv.sources]
qavach-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qavach_storage"]
