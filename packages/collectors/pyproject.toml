[project]
name = "qavach-collectors"
version = "0.1.0"
description = "Collector protocol implementations. Every source — delegated subprocess/container or QAVACH-built — sits behind this package. See ARCH.md §2."
requires-python = ">=3.12"
dependencies = [
    "qavach-core",
    "qavach-sandbox",
    "cryptography>=42",
    "packageurl-python>=0.15",
    "boto3>=1.35",
    "pyelftools>=0.31",
    "pefile>=2023.2.7",
    "macholib>=1.16",
]

[tool.uv.sources]
qavach-core = { workspace = true }
qavach-sandbox = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qavach_collectors"]
