[project]
name = "qavach-core"
version = "0.1.0"
description = "QAVACH domain model, normalisation, reconciliation, risk, recommendation and roadmap logic. Pure Python: zero I/O, zero framework imports. See CLAUDE.md §3."
requires-python = ">=3.12"
dependencies = ["cryptography>=46"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qavach_core"]
