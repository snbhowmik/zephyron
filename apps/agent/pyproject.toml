[project]
name = "qavach-agent"
version = "0.1.0"
description = "Deployed host agent — outbound-poll-only, mTLS, typed scan-spec only. Imports qavach_collectors directly; owns no parsing logic of its own. See ARCH.md §3a."
requires-python = ">=3.12"
dependencies = [
    "qavach-collectors",
    "httpx>=0.27",
]

[tool.uv.sources]
qavach-collectors = { workspace = true }

[dependency-groups]
dev = [
    "pyinstaller>=6.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qavach_agent"]
