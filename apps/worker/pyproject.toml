[project]
name = "qavach-worker"
version = "0.1.0"
description = "RQ workers — orchestrates the collect → normalise → reconcile → context → risk → recommend → roadmap pipeline. Sync workers; collectors are blocking subprocess calls. See CLAUDE.md §4."
requires-python = ">=3.12"
dependencies = [
    "qavach-core",
    "qavach-collectors",
    "qavach-storage",
    "qavach-sandbox",
    "rq>=1.16",
    "redis>=5.0",
]

[tool.uv.sources]
qavach-core = { workspace = true }
qavach-collectors = { workspace = true }
qavach-storage = { workspace = true }
qavach-sandbox = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qavach_worker"]
