# T-002. Dev-only infrastructure: postgres, redis, minio. `make dev` brings
# these up and waits for all three healthchecks. api/worker/web services are
# added once their Dockerfiles exist (T-072, T-073, T-100) — see ARCH.md §13.
#
# Runs under either `docker compose` or `podman compose` (CLAUDE.md §4 / NOTE.md
# §5 — Docker or Podman, per-job container; the choice is kept swappable).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qavach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qavach_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-qavach}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qavach} -d ${POSTGRES_DB:-qavach}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # MinIO no longer publishes to Docker Hub (minio/minio 404s) — quay.io
    # is the only current source. Verified against the live registry 2026-09-17.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z.hotfix.7aa24e772
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-qavach}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-qavach_dev_only}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  minio_data:
